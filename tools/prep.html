<!doctype html>
<html><head><meta charset="utf-8"><title>素材前處理</title>
<style>body{background:#5a8c5a;font:13px sans-serif;color:#fff}.c{display:inline-block;margin:6px;text-align:center}img,canvas{max-width:180px;max-height:180px;display:block;background:repeating-conic-gradient(#888 0 25%,#aaa 0 50%) 0 0/16px 16px}</style>
</head><body><div id="out"></div>
<script>
// mode: 'chef' = 去白底但保留原尺寸比例（所有姿勢對齊）；'item' = 去白底並裁切；'copy' = 只縮放
const JOBS = [
  ['chef_idle.webp','chef'],['chef_wave.webp','chef'],['chef_knife.webp','chef'],['chef_spatula.webp','chef'],
  ['chef_sauce.webp','chef'],['chef_great.png','chef'],['chef_nice.webp','chef'],['chef_bad.webp','chef'],['chef_cheer.webp','chef'],
  ['cabbage_raw.webp','item'],['cabbage_shred.webp','item'],['bacon_raw.webp','item'],['bacon_bits.webp','item'],
  ['noodles_raw.webp','item'],['yakisoba.webp','item'],['crepe_raw.webp','item'],['crepe_sauce.webp','item'],
  ['okonomiyaki.webp','item'],['button.png','item'],['great_text.png','item'],['griddle.png','wide'],
];
// wide = 已是透明底的寬圖（鐵板吧台），只裁切縮放
const MAXW = { chef: 560, item: 420, wide: 760 };
function load(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function removeBg(c){
  const x=c.getContext('2d'),w=c.width,h=c.height,d=x.getImageData(0,0,w,h),p=d.data;
  const seen=new Uint8Array(w*h),clr=new Uint8Array(w*h),st=[];
  const bg=i=>{const k=i*4;return p[k+3]<24||(p[k]>226&&p[k+1]>226&&p[k+2]>226);};
  for(let i=0;i<w;i++)st.push(i,(h-1)*w+i); for(let j=0;j<h;j++)st.push(j*w,j*w+w-1);
  while(st.length){const i=st.pop();if(seen[i])continue;seen[i]=1;if(!bg(i))continue;p[i*4+3]=0;clr[i]=1;
    const xx=i%w;if(xx>0)st.push(i-1);if(xx<w-1)st.push(i+1);if(i>=w)st.push(i-w);if(i<w*(h-1))st.push(i+w);}
  // 兩輪柔化白邊
  for(let pass=0;pass<2;pass++){const mark=[];
    for(let i=w;i<w*(h-1);i++){if(clr[i])continue;if(clr[i-1]||clr[i+1]||clr[i-w]||clr[i+w]){const k=i*4,m=Math.min(p[k],p[k+1],p[k+2]);
      if(m>200){p[k+3]=pass?Math.round(p[k+3]*0.5):0;mark.push(i);}}}
    if(!pass)mark.forEach(i=>clr[i]=1);}
  x.putImageData(d,0,0);
}
function bbox(c){const w=c.width,h=c.height,p=c.getContext('2d').getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(p[(j*w+i)*4+3]>16){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j;}
  return [x0,y0,x1-x0+1,y1-y0+1];}
// 從遊戲伺服器（5173）開啟時，存檔送到前處理伺服器（5174）
const SAVE = location.port === '5174' ? '' : 'http://localhost:5174';
// 招牌內框（背景原圖 848x1264 座標）：招牌微微後仰，內框是上寬下窄的梯形
const SIGN = { tl: [193, 57], tr: [656, 57], br: [647, 211], bl: [200, 210] };
// LOGO 各部分在 logo_daio.jpg（1024x1024）中的位置：T = 「大王焼」字、E = 骷髏＋鏟子
const LOGO_T = { x: 103, y: 131, w: 816, h: 233 }, LOGO_E = { x: 203, y: 402, w: 622, h: 560 };
// 去背：只留白色與紅色（依亮度轉成透明度），才能疊在布紋上
function keyed(im){ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; const x=c.getContext('2d'); x.drawImage(im,0,0); const d=x.getImageData(0,0,c.width,c.height), p=d.data;
  for(let i=0;i<p.length;i+=4){ const m=Math.max(p[i],p[i+1],p[i+2]); p[i+3]=Math.round(255*Math.min(1,Math.max(0,(m-70)/90))); } x.putImageData(d,0,0); return c; }
// 招牌：布紋底（取自旗子沒有圖案的地方）＋橫排「骷髏左、大王焼右」＋光影，最後依梯形逐列貼進內框
async function signLogo(g, logo, flag){
  const S = SIGN, Q = 2;                                   // 先在 2 倍解析度的長方形畫好，再貼進梯形
  const w = S.tr[0] - S.tl[0], h = S.bl[1] - S.tl[1];
  const c = document.createElement('canvas'); c.width = w * Q; c.height = h * Q; const x = c.getContext('2d'); x.scale(Q, Q); x.imageSmoothingQuality = 'high';
  x.drawImage(flag, 70, 90, 250, 560, 0, 0, w, h);
  x.fillStyle = 'rgba(0,0,0,.15)'; x.fillRect(0, 0, w, h);
  const L = keyed(logo), T = LOGO_T, E = LOGO_E;
  const eh = h - 16, ew = E.w * eh / E.h, th = Math.min((w - ew - 48) * T.h / T.w, h - 30), tw = T.w * th / T.h;
  const x0 = (w - (ew + 20 + tw)) / 2;
  x.drawImage(L, E.x, E.y, E.w, E.h, x0, 8, ew, eh);
  x.drawImage(L, T.x, T.y, T.w, T.h, x0 + ew + 20, (h - th) / 2, tw, th);
  // 光影：燈籠暖光（白字微暖）、屋簷 / 外框陰影、左右暗角
  x.globalCompositeOperation = 'multiply'; x.fillStyle = '#ffe2b8'; x.fillRect(0, 0, w, h);
  x.globalCompositeOperation = 'source-over';
  let gr = x.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(0,0,0,.45)'); gr.addColorStop(0.18, 'rgba(0,0,0,0)'); gr.addColorStop(0.85, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.35)');
  x.fillStyle = gr; x.fillRect(0, 0, w, h);
  gr = x.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, 'rgba(0,0,0,.35)'); gr.addColorStop(0.1, 'rgba(0,0,0,0)'); gr.addColorStop(0.9, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.35)');
  x.fillStyle = gr; x.fillRect(0, 0, w, h);
  // 逐列貼進梯形（左右邊依高度內縮）
  const y0 = S.tl[1], y1 = S.bl[1];
  for (let y = y0; y < y1; y++) {
    const t = (y - y0) / (y1 - y0), xl = S.tl[0] + (S.bl[0] - S.tl[0]) * t, xr = S.tr[0] + (S.br[0] - S.tr[0]) * t;
    g.drawImage(c, 0, t * c.height, c.width, c.height / (y1 - y0) + 1, xl, y, xr - xl, 1.5);
  }
  // 內框邊的深色框線（壓回去，接得更自然）
  g.strokeStyle = 'rgba(40,20,8,.85)'; g.lineWidth = 2.5; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(...S.tl); g.lineTo(...S.tr); g.lineTo(...S.br); g.lineTo(...S.bl); g.closePath(); g.stroke();
}async function run(){
  const report=[];
  for(const [file,mode] of JOBS){
    const img=await load('../assets/source/'+file);
    let c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);
    if(mode!=='wide')removeBg(c);
    let [bx,by,bw,bh]=mode!=='chef'?bbox(c):[0,0,c.width,c.height];
    const pad=mode==='item'?4:0, s=Math.min(1,MAXW[mode]/bw);
    const o=document.createElement('canvas');o.width=Math.round((bw+pad*2)*s);o.height=Math.round((bh+pad*2)*s);
    const ox=o.getContext('2d');ox.imageSmoothingQuality='high';ox.drawImage(c,bx-pad,by-pad,bw+pad*2,bh+pad*2,0,0,o.width,o.height);
    const name=file.replace(/\.\w+$/,'.png');
    const blob=await new Promise(r=>o.toBlob(r,'image/png'));
    const r=await fetch(SAVE+'/__save?name='+name,{method:'POST',body:blob,mode:SAVE?'no-cors':'same-origin'});
    report.push({name,w:o.width,h:o.height,src:img.naturalWidth+'x'+img.naturalHeight,ok:r.ok});
    const div=document.createElement('div');div.className='c';div.append(o);div.append(name+' '+o.width+'x'+o.height);document.getElementById('out').append(div);
  }
  // 背景：把招牌上的「大王焼き」換成 LOGO（黑底補滿內框、置中），再補上與原招牌一致的光影，存 jpg
  const bg=await load('../assets/source/bg_stall.jpg');const bc=document.createElement('canvas');bc.width=bg.naturalWidth;bc.height=bg.naturalHeight;const bx=bc.getContext('2d');bx.drawImage(bg,0,0);
  await signLogo(bx, await load('../assets/source/logo_daio.jpg'), await load('../assets/source/logo_flag.jpg'));
  const bb=await new Promise(r=>bc.toBlob(r,'image/jpeg',0.88));const rr=await fetch(SAVE+'/__save?name=bg_stall.jpg',{method:'POST',body:bb,mode:SAVE?'no-cors':'same-origin'});
  report.push({name:'bg_stall.jpg',w:bc.width,h:bc.height,ok:rr.ok});
  window.REPORT=report;return report;
}
window.DONE=run();
</script></body></html>
