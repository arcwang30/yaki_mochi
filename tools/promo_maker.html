<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>宣傳圖產生器</title>
<!-- 宣傳圖／App Store 截圖產生器：遊戲畫面直接從目前的遊戲擷取（隱藏的 iframe，?noloop 逐格推進），再排進宣傳圖版面
     開啟：powershell -ExecutionPolicy Bypass -File tools\prep_server.ps1 -Port 5175 -Out promo\store → http://localhost:5175/tools/promo_maker.html
     輸出到 promo/store：{語言}_{尺寸}_{編號}.jpg（語言 zh/ja/en/ko；尺寸 social 1080×1920、iphone 1320×2868、ipad 2064×2752）
     JPG：App Store 的截圖不能有透明（alpha）通道 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&family=Noto+Sans+JP:wght@900&family=Noto+Sans+KR:wght@900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 16px; background: #1b1b22; color: #ddd; font: 14px/1.5 system-ui, sans-serif; }
  #bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  button, select { font: inherit; padding: 6px 12px; }
  #st { color: #9fd; }
  #out { display: flex; flex-wrap: wrap; gap: 10px; }
  #out figure { margin: 0; }
  #out img { height: 360px; display: block; border: 1px solid #444; }
  #out figcaption { font-size: 12px; color: #aaa; }
  #game { position: absolute; left: -10000px; top: 0; width: 720px; height: 1280px; border: 0; }
</style>
</head>
<body>
<div id="bar">
  <select id="lang"><option value="all">全部語言</option><option>zh</option><option>ja</option><option>en</option><option>ko</option></select>
  <select id="size"><option value="all">全部尺寸</option><option>social</option><option>iphone</option><option>ipad</option></select>
  <button id="preview" disabled>預覽</button>
  <button id="save" disabled>預覽並輸出到 promo/store</button>
  <button id="review" disabled>內購審核截圖</button>
  <span id="st">載入遊戲中…</span>
</div>
<div id="out"></div>
<iframe id="game" src="../index.html?noloop&vols=3&layout=portrait"></iframe>
<script>
'use strict';
const $ = id => document.getElementById(id);
const st = t => { $('st').textContent = t; };
// 讓出時間（給畫面更新、圖片載入）：用 MessageChannel，分頁在背景時 setTimeout 會被瀏覽器大幅節流
const yieldNow = () => new Promise(r => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });
const SIZES = { social: [1080, 1920, 'phone'], iphone: [1320, 2868, 'phone'], ipad: [2064, 2752, 'pad'] };
const LANGS = ['zh', 'ja', 'en', 'ko'];
const FONTS = { zh: "'Noto Sans TC'", ja: "'Noto Sans JP'", en: "'Mochiy Pop One'", ko: "'Noto Sans KR'" };

// ===================== 文案：[ ] 括起來的字用金橘色強調 =====================
const COPY = {
  1: { zh: ['[一顆按鈕]', '跟著節拍[做廣島燒]！', '食材從兩邊飛來，落下的瞬間按下去！'],
       ja: ['[ボタンひとつ]で', 'リズムに乗って[広島焼き]！', '左右から飛んでくる食材、落ちる瞬間に押せ！'],

       ja: ['[4 つの食材]をそろえて', '広島焼き[完成]！', 'コンボで高得点！広島焼きひとつで +1000 点'],
       en: ['Collect [ALL FOUR]', 'Okonomiyaki [DONE]!', 'Chain combos, and every okonomiyaki is +1000!'],
       ko: ['[네 가지 재료]를 모아', '오코노미야키 [완성]!', '콤보가 쌓일수록 고득점! 오코노미야키 하나에 +1000점'],
       badge: { zh: '+1000\n分！', ja: '+1000\n点！', en: '+1000!', ko: '+1000\n점!' } },

       ja: ['オリジナル曲[15 曲]', '★1～5 で[どんどん速く]！', '和琴ローファイ、ボサノバ、祭り太鼓、ジャズ、8-bit…'],
       en: ['[15] ORIGINAL SONGS', '1-5 stars, [faster & faster]!', 'Lo-fi, bossa nova, taiko, jazz, 8-bit, and more'],
       ko: ['오리지널 곡 [15곡]', '★1~5로 [점점 빠르게]!', '로파이, 보사노바, 축제 타이코, 재즈, 8비트…'],
       badge: { zh: '簡單\n普通\n困難', ja: 'かんたん\nふつう\nむずかしい', en: 'EASY\nNORMAL\nHARD', ko: '쉬움\n보통\n어려움' } },
  4: { zh: ['[節奏評價]', '挑戰[傳說的鐵板之神]！', '5 種趣味評價，看看你是哪一級！'],
       ja: ['[リズム評価]', '目指せ[伝説の鉄板の神]！', '5 段階の評価で、あなたの腕前をチェック！'],
       en: ['[RHYTHM RANK]', 'Become a [Griddle Legend]!', '5 fun ranks. Where do you stand?'],
       ko: ['[리듬 평가]', '노려라 [전설의 철판의 신]!', '5단계 평가로 내 실력을 확인해 보세요!'],
       badge: { zh: 'NEW\nRECORD', ja: 'NEW\nRECORD', en: 'NEW\nRECORD', ko: 'NEW\nRECORD' } },
  5: { zh: ['[收集]店面背景', '和[陪伴寵物]！', '用遊玩得到的遊戲幣，打造你的屋台'],
       ja: ['屋台の背景と', '[おともペット]を[集めよう]！', 'プレイで貯めたコインで、自分だけの屋台に'],
       en: ['Collect [STALL STYLES]', 'and [PET BUDDIES]!', 'Spend the coins you earn to deck out your stall'],
       ko: ['포장마차 배경과', '[함께하는 펫]을 [모아요]!', '플레이로 모은 코인으로 나만의 포장마차를 꾸며요'],
       badge: { zh: '寵物跟著\n節拍動！', ja: 'ペットも\nノリノリ！', en: 'Pets\ngroove\nalong!', ko: '펫도\n박자에\n맞춰요!' } },
  6: { zh: ['[{ach} 個成就]', '等你解鎖！', '節奏分析告訴你：是早了還是晚了？'],
       ja: ['[{ach} 個の実績]を', '解除しよう！', 'リズム分析で、早い？遅い？がわかる'],
       en: ['[{ach} ACHIEVEMENTS]', 'to unlock!', 'Rhythm analysis shows if you tap early or late'],
       ko: ['[{ach}개의 업적]을', '해금해 보세요!', '리듬 분석으로 빨랐는지 늦었는지 알 수 있어요'],
       badge: { zh: '銅・銀\n金・白金', ja: '銅・銀\n金・白金', en: 'Bronze\nto\nPlatinum', ko: '동・은\n금・백금' } },
};

// ===================== 遊戲（iframe）=====================
const win = () => $('game').contentWindow;
const run = code => win().eval(code);   // 遊戲的全域 const／let（RES、Game…）不在 window 上，用 eval 在遊戲裡執行
let ready = false;

function waitGame() {
  return new Promise(res => {
    const tick = () => {
      try {
        if (run('typeof Assets !== "undefined" && Assets.loaded >= Assets.names.length && !!window.__step')) return res();
      } catch (e) { /* iframe 還沒載入 */ }
      setTimeout(tick, 200);
    };
    tick();
  });
}

// 遊戲端的準備：不存檔、時鐘由這裡控制、高解析度、宣傳用的存檔內容
function setupGame() {
  run(`
    Save.store = () => {};                    // 不寫進 localStorage
    Sound.init();                             // AudioContext（通常沒有點擊所以是暫停狀態；但遊戲偵測音訊輸出時可能把它開起來）
    if (A.master) A.master.gain.value = 0;    // 不管 AudioContext 有沒有在跑，一律靜音
    RES = 2; cv.width = W * 2; cv.height = H * 2;
    window.__T = 0; Game.clock = () => window.__T;   // 樂曲時鐘：由工具推進
    Screens.game.pause = () => {}; Sound.onStop = null;   // 失去焦點、音訊狀態改變都不要自動暫停
    Input.touchMode = true;                   // 畫面下方顯示手機的操作提示（不是鍵盤）
    Object.assign(Save.data, { diff: 1, bg: 'stall', pet: 'maneki', coins: 2480, xp: 1500, offset: 0, tutorialDone: true, shopSeen: true,
      owned: ['bg:rock', 'bg:animal', 'bg:pixel', 'bg:shiba', 'pet:shiba', 'pet:maneki', 'pet:tanuki', 'pet:tako', 'pet:kingyo'], shopNew: [], achNew: [] });
    // 內建曲目的成績（選曲卡片上的 HISCORE、獎章）
    const demo = { tsukimi: 62400, bossa: 61800, yatai: 63100, chindon: 58800, swing: 66200, ska: 64400, animepop: 59900, breaks: 61200, funk: 68400, chip: 57600, gtrock: 63800 };
    Object.entries(demo).forEach(([id, sc], i) => {
      Save.data.best[id] = { score: sc, oko: 12, combo: 120 };
      Save.data.medals[id] = { r: i % 3 === 0 ? 0 : 1, fc: i % 2 === 0, ag: i === 4 };
      Save.data.totals.songs[id] = 3;
    });
    window.__promoStep = (n, auto) => {
      for (let i = 0; i < n; i++) {
        const s = Game.s, dt = 1 / 60;
        if (App.name === 'game' && s && !s.ended && !s.paused) {
          window.__T += dt;
          if (auto) {   // 自動打擊：落下的瞬間判定（偶爾 NICE，比較自然）
            const t = Game.songTime();
            for (const nt of s.chart.notes) if (nt.state === 'fly' && nt.t <= t) { s.errs.push(0.004); Game.judge(nt, Math.random() < 0.06 ? 'NICE' : 'GREAT'); }
          }
        }
        __step(dt);
        Achieve.toasts.length = 0;   // 成就解鎖通知不要入鏡
      }
    };
  `);
}
const step = (n, auto = true) => run(`__promoStep(${n}, ${auto})`);
const snap = () => { const c = document.createElement('canvas'), g = win().document.getElementById('game'); c.width = g.width; c.height = g.height; c.getContext('2d').drawImage(g, 0, 0); return c; };
const until = (cond, max = 60 * 200) => { for (let i = 0; i < max; i++) { if (run(cond)) return true; step(1); } throw new Error('等不到：' + cond); };
// 等字型下載完再擷取：中日韓字型是分段、用到才下載的，第一次畫到的字可能還是備用字型。
// 畫一幀觸發下載 → 等遊戲頁的字型都載完（最多 10 秒）→ 再畫一幀（不打擊，只推進 1 幀）
async function settle() {
  step(1, false);
  const fonts = win().document.fonts;
  for (const t0 = performance.now(); performance.now() - t0 < 10000 && fonts.status !== 'loaded';) await yieldNow();
  await fonts.ready;
  step(1, false);
}

// 六個場景的遊戲畫面（每個語言各擷取一次）
async function captureScenes(lang) {
  run(`Save.data.lang = '${lang}'; document.documentElement.lang = '${lang}'; Save.data.best.swing = { score: 61200, oko: 14, combo: 140 };`);
  const shots = {};
  // ---- 遊玩：鉄板スウィング、普通 ----
  // 樂曲時鐘從 AudioContext 現在的時間開始：譜面的時間是以 A.ctx.currentTime 為起點（AudioContext 在跑時不是 0）
  run(`window.__T = A.ctx ? A.ctx.currentTime : 0; App.cut('game', { song: songById('swing') }); Pet.reset && Pet.reset();`);
  step(30);
  // 2：第 3 份廣島燒完成的瞬間（飛向右上角之前）
  until(`Game.s.oko >= 3 && Game.s.okoAnims.some(a => a.t > 0.42)`);
  await settle(); shots[2] = snap();
  // 1：30 連擊（GREAT＋「30 COMBO!」）
  until(`Game.s.combo >= 30 && Game.s.comboFx && Game.s.comboFx.n === 30 && Game.s.comboFx.t > 0.18`);
  await settle(); shots[1] = snap();
  // 4：打完整首 → 結算（評價印章、屋台經驗條都出來之後）
  until(`App.name === 'result' && Screens.result.t > 3.2`, 60 * 400);
  await settle(); shots[4] = snap();
  // ---- 3：選曲（ソース・ファンク 4 星，內建曲目）----
  run(`Save.data.lastSong = 'funk'; App.cut('songs');`); step(90, false);
  await settle(); shots[3] = snap();
  // ---- 5：商店「店面背景」，選「浮世妖怪」 ----
  run(`App.cut('shop');`);
  for (const t0 = performance.now(); performance.now() - t0 < 15000 && !run(`BACKGROUNDS.every(b => IMG['bg_' + b.id])`);) await yieldNow();   // 等背景圖都載入（縮圖、預覽；圖片是非同步載入，要讓出時間）
  run(`Screens.shop.setCat(1); Screens.shop.pick(BACKGROUNDS.findIndex(b => b.id === 'yokai'));`); step(60, false);
  await settle(); shots[5] = snap();
  // ---- 6：成就（解鎖約一半）----
  run(`const L = Achieve.list(); L.forEach((a, i) => { if (i % 2 === 0 || i < 8) Save.data.achievements[a.id] = Date.now(); }); App.cut('achievements');`); step(40, false);
  await settle(); shots[6] = snap();
  return shots;
}

// ===================== 版面 =====================
let seed = 1;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const IMG = n => run(`IMG[${JSON.stringify(n)}]`);

function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

// 背景：夜空漸層、光暈、星星、上方燈籠串、下方青海波＋暖光散景
function drawBg(c, Wd, Ht, u) {
  const g = c.createLinearGradient(0, 0, 0, Ht);
  g.addColorStop(0, '#12184a'); g.addColorStop(0.45, '#2a1a5e'); g.addColorStop(0.8, '#4a1a4e'); g.addColorStop(1, '#5a1e3a');
  c.fillStyle = g; c.fillRect(0, 0, Wd, Ht);
  for (const [x, y, r, col] of [[0.15, 0.12, 0.5, '120,90,255'], [0.9, 0.3, 0.45, '255,120,200'], [0.2, 0.6, 0.5, '90,120,255'], [0.85, 0.85, 0.6, '255,140,60']]) {
    const rg = c.createRadialGradient(x * Wd, y * Ht, 0, x * Wd, y * Ht, r * Wd);
    rg.addColorStop(0, `rgba(${col},.22)`); rg.addColorStop(1, `rgba(${col},0)`); c.fillStyle = rg; c.fillRect(0, 0, Wd, Ht);
  }
  seed = 7;
  for (let i = 0; i < 160; i++) { c.fillStyle = `rgba(255,255,255,${0.2 + rnd() * 0.6})`; c.beginPath(); c.arc(rnd() * Wd, rnd() * Ht * 0.7, (0.6 + rnd() * 1.8) * u, 0, 7); c.fill(); }
  // 青海波（下方 35%，越往下越明顯）
  const top = Ht * 0.62, R = 46 * u;
  c.save();
  const mask = c.createLinearGradient(0, top, 0, Ht); mask.addColorStop(0, 'rgba(0,0,0,0)'); mask.addColorStop(1, 'rgba(0,0,0,1)');
  const pat = document.createElement('canvas'); pat.width = Wd; pat.height = Ht - top;
  const p = pat.getContext('2d'); p.strokeStyle = 'rgba(255,170,120,.16)'; p.lineWidth = 2.2 * u;
  for (let row = 0, y = R; y < pat.height + R; row++, y += R * 0.5) {
    for (let x = (row % 2) * R; x < Wd + R; x += R * 2) for (let k = 1; k <= 4; k++) { p.beginPath(); p.arc(x, y, R * k / 4, Math.PI, 0); p.stroke(); }
  }
  p.globalCompositeOperation = 'destination-in'; const pm = p.createLinearGradient(0, 0, 0, pat.height); pm.addColorStop(0, 'rgba(0,0,0,0)'); pm.addColorStop(1, '#000'); p.fillStyle = pm; p.fillRect(0, 0, Wd, pat.height);
  c.drawImage(pat, 0, top); c.restore();
  // 下方暖光散景（取代原本的 LOGO）
  seed = 31;
  for (let i = 0; i < 26; i++) {
    const x = rnd() * Wd, y = Ht - rnd() * Ht * 0.16, r = (14 + rnd() * 38) * u, hue = ['255,170,80', '255,110,90', '255,220,120', '255,140,200'][i % 4];
    const bg = c.createRadialGradient(x, y, 0, x, y, r); bg.addColorStop(0, `rgba(${hue},.55)`); bg.addColorStop(0.6, `rgba(${hue},.18)`); bg.addColorStop(1, `rgba(${hue},0)`);
    c.fillStyle = bg; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
  const glow = c.createLinearGradient(0, Ht - 220 * u, 0, Ht); glow.addColorStop(0, 'rgba(255,140,60,0)'); glow.addColorStop(1, 'rgba(255,140,60,.22)');
  c.fillStyle = glow; c.fillRect(0, Ht - 220 * u, Wd, 220 * u);
  // 上方燈籠串
  const cols = ['#ff6a2a', '#ffd23f', '#ff4a3a', '#ff7ad8', '#4ae07a', '#ff6a2a', '#ffd23f', '#b07aff', '#ff6a2a'], N = cols.length;
  c.strokeStyle = 'rgba(40,20,10,.8)'; c.lineWidth = 2.5 * u; c.beginPath();
  for (let i = 0; i <= 40; i++) { const x = Wd * i / 40, y = 30 * u + Math.sin(Math.PI * i / 40) * 26 * u; i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();
  cols.forEach((col, i) => {
    const x = Wd * (i + 0.5) / N, y = 30 * u + Math.sin(Math.PI * (i + 0.5) / N) * 26 * u + 34 * u, w = 40 * u, h = 52 * u;
    const gl = c.createRadialGradient(x, y, 0, x, y, 70 * u); gl.addColorStop(0, col + '88'); gl.addColorStop(1, col + '00'); c.fillStyle = gl; c.fillRect(x - 70 * u, y - 70 * u, 140 * u, 140 * u);
    const b = c.createRadialGradient(x - w * 0.15, y - h * 0.15, 0, x, y, w * 0.7); b.addColorStop(0, '#fff6d0'); b.addColorStop(0.35, col); b.addColorStop(1, '#3a1208');
    c.fillStyle = b; c.beginPath(); c.ellipse(x, y, w / 2, h / 2, 0, 0, 7); c.fill();
    c.fillStyle = '#2a1a12'; rr(c, x - w * 0.3, y - h / 2 - 5 * u, w * 0.6, 8 * u, 2 * u); c.fill(); rr(c, x - w * 0.3, y + h / 2 - 3 * u, w * 0.6, 8 * u, 2 * u); c.fill();
  });
}

function sparkle(c, x, y, r, a = 1) {
  c.save(); c.globalAlpha = a; c.fillStyle = '#fffbe0'; c.shadowColor = 'rgba(255,240,180,.9)'; c.shadowBlur = r;
  c.beginPath(); for (let j = 0; j < 8; j++) { const ang = j * Math.PI / 4, q = j % 2 ? r * 0.18 : r; c.lineTo(x + Math.cos(ang) * q, y + Math.sin(ang) * q); } c.closePath(); c.fill(); c.restore();
}
function confetti(c, Wd, Ht, u, n) {
  seed = 99; const cols = ['#ff5a7a', '#ffd23f', '#4ad0ff', '#7ae07a', '#ff9a3a', '#c07aff'];
  for (let i = 0; i < n; i++) { c.save(); c.translate(rnd() * Wd, 120 * u + rnd() * (Ht - 200 * u)); c.rotate(rnd() * 6); c.fillStyle = cols[i % cols.length]; c.globalAlpha = 0.75; c.fillRect(-6 * u, -2.5 * u, 12 * u, 5 * u); c.restore(); }
}
function note(c, x, y, size, ch = '♪', rot = 0) {
  c.save(); c.translate(x, y); c.rotate(rot); c.font = `${size}px 'Mochiy Pop One', sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = size * 0.16; c.strokeStyle = '#7a2a08'; c.strokeText(ch, 0, 0); c.fillStyle = '#ffc93a'; c.fillText(ch, 0, 0); c.restore();
}

// 大標語：[ ] = 金橘色；白色外框＋深紅描邊＋陰影；太寬自動縮小
function title(c, text, cx, y, size, maxW, font) {
  const parts = []; text.replace(/\[([^\]]+)\]|([^[]+)/g, (m, hi, plain) => { parts.push({ t: hi || plain, hi: !!hi }); });
  c.save(); c.textBaseline = 'middle'; c.lineJoin = 'round';
  const setF = s => { c.font = `900 ${s}px ${font}, sans-serif`; };
  setF(size); let w = parts.reduce((a, p) => a + c.measureText(p.t).width, 0);
  if (w > maxW) { size *= maxW / w; setF(size); w = maxW; }
  let x = cx - w / 2;
  const pass = fn => { let xx = x; parts.forEach(p => { fn(p, xx); xx += c.measureText(p.t).width; }); };
  c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowOffsetY = size * 0.08; c.shadowBlur = size * 0.1;
  c.strokeStyle = '#fff4dc'; c.lineWidth = size * 0.36; pass((p, xx) => c.strokeText(p.t, xx, y));
  c.shadowColor = 'transparent';
  c.strokeStyle = '#7a1a08'; c.lineWidth = size * 0.2; pass((p, xx) => c.strokeText(p.t, xx, y));
  pass((p, xx) => {
    if (p.hi) { const g = c.createLinearGradient(0, y - size / 2, 0, y + size / 2); g.addColorStop(0, '#ffe680'); g.addColorStop(0.55, '#ffab2a'); g.addColorStop(1, '#ff7a10'); c.fillStyle = g; }
    else c.fillStyle = '#fffaf0';
    c.fillText(p.t, xx, y);
  });
  c.restore();
}
function subtitle(c, text, cx, y, size, maxW, font) {
  c.save(); c.font = `900 ${size}px ${font}, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  const w = c.measureText(text).width; if (w > maxW) { size *= maxW / w; c.font = `900 ${size}px ${font}, sans-serif`; }
  c.lineWidth = size * 0.22; c.strokeStyle = 'rgba(20,10,40,.85)'; c.strokeText(text, cx, y); c.fillStyle = '#ffffff'; c.fillText(text, cx, y); c.restore();
}
// 星形標章（多行文字）
function badge(c, x, y, r, text, col1, col2, rot, font) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.shadowColor = 'rgba(0,0,0,.4)'; c.shadowBlur = r * 0.2; c.shadowOffsetY = r * 0.06;
  c.beginPath(); for (let j = 0; j < 32; j++) { const a = j * Math.PI / 16, q = j % 2 ? r * 0.86 : r; c.lineTo(Math.cos(a) * q, Math.sin(a) * q); } c.closePath();
  const g = c.createRadialGradient(0, -r * 0.3, 0, 0, 0, r); g.addColorStop(0, col1); g.addColorStop(1, col2); c.fillStyle = g; c.fill();
  c.shadowColor = 'transparent'; c.lineWidth = r * 0.07; c.strokeStyle = '#fff'; c.stroke();
  const lines = text.split('\n'), fs = r * (lines.length > 2 ? 0.3 : 0.4);
  c.font = `900 ${fs}px ${font}, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  lines.forEach((l, i) => {
    const yy = (i - (lines.length - 1) / 2) * fs * 1.08, w = c.measureText(l).width, k = Math.min(1, r * 1.5 / w);
    c.save(); c.scale(k, k); c.lineWidth = fs * 0.22; c.strokeStyle = 'rgba(80,20,0,.7)'; c.strokeText(l, 0, yy / k); c.fillStyle = '#fff'; c.fillText(l, 0, yy / k); c.restore();
  });
  c.restore();
}
function food(c, name, x, y, w, rot) {
  const im = IMG(name); if (!im) return;
  const h = w * im.height / im.width;
  c.save(); c.translate(x, y); c.rotate(rot); c.shadowColor = 'rgba(0,0,0,.45)'; c.shadowBlur = w * 0.08; c.shadowOffsetY = w * 0.04;
  c.drawImage(im, -w / 2, -h / 2, w, h); c.restore();
}
// 手機／平板外框：金色外框＋黑色邊框，裡面放畫面
function device(c, x, y, w, h, screen, u) {
  const r = 46 * u, b = 14 * u;
  c.save(); c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 50 * u; c.shadowOffsetY = 18 * u;
  rr(c, x - b, y - b, w + b * 2, h + b * 2, r + b); c.fillStyle = '#16121c'; c.fill(); c.restore();
  c.save(); c.lineWidth = 6 * u; c.strokeStyle = '#e8b64a'; rr(c, x - b, y - b, w + b * 2, h + b * 2, r + b); c.stroke(); c.restore();
  c.save(); rr(c, x, y, w, h, r); c.clip(); c.drawImage(screen, x, y, w, h); c.restore();
}

// iPad 畫面：3:4，中間是遊戲（9:16），兩側用遊戲裡的廣島燒掛簾（js/sides.js）
function padScreen(game) {
  const vw = 1032, vh = 1376, k = 2, c = document.createElement('canvas'); c.width = vw * k; c.height = vh * k;
  const g = c.getContext('2d'); g.scale(k, k);
  const bg = g.createRadialGradient(vw / 2, vh * 0.3, 0, vw / 2, vh * 0.3, vh * 0.8); bg.addColorStop(0, '#2a2050'); bg.addColorStop(0.7, '#0d1024'); g.fillStyle = bg; g.fillRect(0, 0, vw, vh);
  const gw = vh * 720 / 1280, side = (vw - gw) / 2, S = run('Sides');
  S.BANNERS.forEach((b, i) => { const x0 = i ? vw - side : 0, end = S.banner(g, x0, side, vh, b); S.lanterns(g, x0 + side / 2, end, vh, Math.min(side * 0.7, 180), b.lanterns); });
  g.drawImage(game, side, 0, gw, vh);
  return c;
}

// 一張宣傳圖
function compose(n, lang, sizeKey, game, achCount) {
  const [Wd, Ht, kind] = SIZES[sizeKey], u = Wd / 1080, font = FONTS[lang];
  const c = document.createElement('canvas'); c.width = Wd; c.height = Ht; const g = c.getContext('2d');
  drawBg(g, Wd, Ht, u);
  confetti(g, Wd, Ht, u, 46);
  const copy = COPY[n], [l1, l2, sub] = copy[lang].map(s => s.replace('{ach}', achCount));
  const pad = kind === 'pad', ty = pad ? 200 * u : 215 * u, ts = pad ? 112 * u : 128 * u;
  title(g, l1, Wd / 2, ty, ts, Wd - 120 * u, font);
  title(g, l2, Wd / 2, ty + ts * 1.18, ts, Wd - 80 * u, font);
  subtitle(g, sub, Wd / 2, ty + ts * 2.12, (pad ? 40 : 44) * u, Wd - 140 * u, font);
  for (const [x, y, r] of [[0.06, 0.16, 26], [0.95, 0.17, 30], [0.07, 0.52, 18], [0.93, 0.6, 22], [0.12, 0.88, 26], [0.88, 0.9, 20]]) sparkle(g, x * Wd, y * Ht, r * u);
  // 裝置
  const top = ty + ts * 2.12 + 70 * u, bottom = Ht - (pad ? 110 : 170) * u;
  const screen = pad ? padScreen(game) : game, aspect = screen.width / screen.height;
  let h = bottom - top, w = h * aspect; const maxW = Wd * (pad ? 0.7 : 0.74); if (w > maxW) { w = maxW; h = w / aspect; }
  const dx = (Wd - w) / 2, dy = top + Math.min(30 * u, (bottom - top - h) / 2);   // 緊接在標語下面；多出來的空間留給下方的散景
  // 裝置後面的食材、音符
  const fx = [['noodles_raw', -0.36, 0.2, 230, -0.2], ['cabbage_raw', 0.38, 0.1, 200, 0.15], ['bacon_raw', 0.4, 0.5, 220, 0.25], ['crepe_raw', -0.4, 0.68, 210, -0.1]];
  if (n === 1 || n === 2) fx.forEach(([nm, ux, uy, sz, rot]) => food(g, nm, Wd / 2 + ux * Wd * (pad ? 0.95 : 1), dy + uy * h, sz * u, rot));
  note(g, Wd * 0.09, dy + h * 0.06, 90 * u, '♪', -0.2); note(g, Wd * 0.92, dy + h * 0.4, 84 * u, '♫', 0.15); note(g, Wd * 0.1, dy + h * 0.55, 70 * u, '♫', 0.1);
  device(g, dx, dy, w, h, screen, u);
  // 標章
  // 標章：手機壓在裝置邊緣（避開 HUD 與按鈕）；iPad 放在兩側空白（不擋掛簾與燈籠）
  const b = copy.badge[lang], br = (pad ? 100 : 112) * u, L = 'L', R = 'R';
  const bpos = { 1: [R, 0.86, 0.18, '#ffb02a', '#ff6a10'], 2: [L, 0.86, -0.15, '#ffb02a', '#ff6a10'],
    3: [L, 0.85, -0.15, '#5ab0ff', '#2a5ad6'], 4: [R, 0.88, 0.15, '#ffb02a', '#ff6a10'],
    5: [R, 0.4, 0.15, '#7ae08a', '#2a9a4a'], 6: [R, 0.9, 0.15, '#ff7ad0', '#c03a9a'] }[n];
  const bx = pad ? (bpos[0] === L ? dx / 2 + 10 * u : (dx + w + Wd) / 2 - 10 * u) : (bpos[0] === L ? dx - 10 * u : dx + w + 10 * u);
  badge(g, bx, dy + h * bpos[1], br, b, bpos[3], bpos[4], bpos[2], font);
  return c;
}

// ===================== 內購審核用截圖 =====================
// App Store Connect 建立內購商品時必附「這個商品在 App 裡的樣子」：商店「追加樂曲」分頁選中該集（鎖著、顯示價格、購買鈕）
// 純遊戲畫面（不加標語、外框），做成 iPhone 6.9 吋全螢幕（1320×2868，遊戲上下留邊，跟實機一樣）
// 價格：App 裡顯示的是 App Store 回傳的當地價格；這裡先放 REVIEW_PRICE，定價後改掉再輸出一次
const REVIEW_PRICE = 'NT$90';
async function captureReview(lang, vol) {
  run(`Save.data.lang = '${lang}';
    Shop.store = { name: 'review', owns: () => false, price: () => ${JSON.stringify(REVIEW_PRICE)}, buy: () => Promise.resolve(false), restore: () => Promise.resolve(0) };
    App.cut('shop');`);
  for (const t0 = performance.now(); performance.now() - t0 < 15000 && !run(`BACKGROUNDS.every(b => IMG['bg_' + b.id])`);) await yieldNow();
  run(`Screens.shop.setCat(0); Screens.shop.pick(${vol - 1});`); step(60, false); await settle();
  const game = snap(), c = document.createElement('canvas'); c.width = 1320; c.height = 2868;
  const g = c.getContext('2d'), bg = g.createRadialGradient(660, 860, 0, 660, 860, 2000);
  bg.addColorStop(0, '#2a2050'); bg.addColorStop(0.7, '#0d1024'); g.fillStyle = bg; g.fillRect(0, 0, 1320, 2868);
  const h = 1320 * game.height / game.width; g.drawImage(game, 0, (2868 - h) / 2, 1320, h);
  return c;
}
async function makeReview() {
  const langs = $('lang').value === 'all' ? ['zh', 'en'] : [$('lang').value];   // 審核人員看英文最方便；中文是主要語系
  $('preview').disabled = $('save').disabled = $('review').disabled = true; $('out').innerHTML = '';
  try {
    for (const lang of langs) for (let v = 1; v <= RELEASED; v++) {
      const name = `review_${lang}_vol${v}.jpg`; st(`${name}…`); await yieldNow();
      const c = await captureReview(lang, v), blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
      const fig = document.createElement('figure'), img = new Image(); img.src = URL.createObjectURL(blob);
      fig.append(img, Object.assign(document.createElement('figcaption'), { textContent: `${name}  ${c.width}×${c.height}` })); $('out').append(fig);
      const r = await fetch('/__save?name=' + name, { method: 'POST', body: blob }); if (!r.ok) throw new Error('存檔失敗：' + name);
    }
    st('完成，內購審核截圖已輸出到 promo/store');
  } catch (e) { st('錯誤：' + e.message); console.error(e); }
  $('preview').disabled = $('save').disabled = $('review').disabled = false;
}
const RELEASED = 3;   // 首發的 VOL 數（和 js/config.js 的 RELEASED_VOLS 一樣）

// ===================== 執行 =====================
async function make(save) {
  const langs = $('lang').value === 'all' ? LANGS : [$('lang').value], sizes = $('size').value === 'all' ? Object.keys(SIZES) : [$('size').value];
  $('preview').disabled = $('save').disabled = $('review').disabled = true; $('out').innerHTML = '';
  try {
    for (const lang of langs) {
      st(`擷取遊戲畫面（${lang}）…`); await yieldNow();
      const shots = await captureScenes(lang), ach = run('Achieve.list().length');
      for (const size of sizes) for (let n = 1; n <= 6; n++) {
        const name = `${lang}_${size}_${n}.jpg`; st(`${name}…`); await yieldNow();
        const c = compose(n, lang, size, shots[n], ach), blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
        const fig = document.createElement('figure'), img = new Image(); img.src = URL.createObjectURL(blob);
        fig.append(img, Object.assign(document.createElement('figcaption'), { textContent: `${name}  ${c.width}×${c.height}` })); $('out').append(fig);
        if (save) { const r = await fetch('/__save?name=' + name, { method: 'POST', body: blob }); if (!r.ok) throw new Error('存檔失敗：' + name); }
      }
    }
    st(save ? '完成，已輸出到 promo/store' : '預覽完成');
  } catch (e) { st('錯誤：' + e.message); console.error(e); }
  $('preview').disabled = $('save').disabled = $('review').disabled = false;
}
$('preview').onclick = () => make(false);
$('save').onclick = () => make(true);
$('review').onclick = makeReview;

(async () => {
  await waitGame();
  await Promise.all(['Noto Sans TC', 'Noto Sans JP', 'Noto Sans KR', 'Mochiy Pop One'].map(f => document.fonts.load(`900 40px '${f}'`)));
  await win().document.fonts.ready;
  setupGame(); ready = true;
  st('準備好了'); $('preview').disabled = $('save').disabled = $('review').disabled = false;
})();
</script>
